services:
  # Express Backend Web Service
  - type: web
    name: ivent-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ivent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: vedantjja@gmail.com
      - key: CLIENT_URL
        fromService:
          type: web
          name: ivent-client
          property: host
          format: https://{host}.onrender.com
      - key: XAI_API_KEY
        sync: false

  # Next.js Frontend Web Service
  - type: web
    name: ivent-client
    runtime: node
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ivent-api
          property: host
          format: https://{host}.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: ivent-db
    plan: free
    region: oregon
    databaseName: ivent
    user: ivent_user
